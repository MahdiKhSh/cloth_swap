# This machine: RTX 5090 (32 GB), 32 GB RAM, models in D:/models (see scripts/download_models.sh).
qwen:
  model_id: ovedrive/Qwen-Image-Edit-2511-4bit
  quantization: prequantized

studio:
  relight_lora: D:/your-models/SCAIL-2-comfy/loras/wan2.1_SCAIL_2_relight_lora_bf16.safetensors

scail:
  python: D:/your-projects/SCAIL-2/.venv/Scripts/python.exe
  repo_dir: D:/your-projects/SCAIL-2
  ckpt_dir: D:/your-models/SCAIL-2
  scail_path: D:/your-models/SCAIL-2-comfy/diffusion_models/wan2.1_14B_SCAIL_2_fp8_scaled.safetensors
  weights: fp8
  target_area: 458752          # 512x896 class; raise to 901120 (704x1280) once this works
  loras:
    - path: D:/your-models/lightx2v/Lightx2v/lightx2v_I2V_14B_480p_cfg_step_distill_rank128_bf16.safetensors
      alpha: 1.0


upscale:
  seedvr2:
    python: D:/your-projects/SeedVR/seed_env/Scripts/python.exe
    cli_dir: D:/your-projects/SeedVR/ComfyUI/custom_nodes/ComfyUI-SeedVR2_VideoUpscaler
    model_dir: D:/your-projects/SeedVR/ComfyUI/models/SEEDVR2

animate:
  transformer_dir: D:/your-models/Wan2.2-Animate-14B-bf16/transformer
  gpu_weight_memory: 22GiB
